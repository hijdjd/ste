name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl perl fakeroot dpkg file unzip xz-utils
          clang --version
      - name: Setup Theos + SDK
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
          ls $THEOS/sdks
          # 用系统 clang 21 充当 toolchain，ld64.lld 做 Mach-O 链接
          TC=$THEOS/toolchain/linux/iphone/bin
          mkdir -p $TC
          ln -sf $(command -v clang) $TC/clang
          ln -sf $(command -v clang++) $TC/clang++
          cat > $TC/ld64 <<W
          #!/bin/bash
          exec $(command -v ld64.lld) "$@"
          W
          chmod +x $TC/ld64
          ln -sf $TC/ld64 $TC/ld
          # 让 -fuse-ld=lld 能找到：建 ld.lld 到 PATH
          sudo ln -sf $(command -v ld64.lld) /usr/local/bin/ld.lld
          ls -l /usr/local/bin/ld.lld
          ls -l $TC
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          # clang 21 在 Linux 上对 apple target 仍找 ld.bfd；直接劫持 bfd 为 ld64.lld
          LD64=$(command -v ld64.lld)
          echo "ld64=$LD64"
          sudo cp /usr/bin/x86_64-linux-gnu-ld.bfd /usr/bin/x86_64-linux-gnu-ld.bfd.real
          sudo tee /usr/bin/x86_64-linux-gnu-ld.bfd >/dev/null <<W
          #!/bin/bash
          # 吃掉 Theos/clang 传的 -fuse-ld=llvm 之类无效 emulation
          args=()
          for a in "\$@"; do
            [ "\$a" = "llvm" ] && continue
            args+=("\$a")
          done
          exec $LD64 "\${args[@]}"
          W
          sudo chmod +x /usr/bin/x86_64-linux-gnu-ld.bfd
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            packages/*.deb
            .theos/obj/**/*.dylib
