name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl perl libncurses-dev libssl-dev unzip zlib1g-dev libstdc++-12-dev fakeroot dpkg
      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
      - name: Setup Linux toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          # 下载 Theos 官方 Linux 交叉工具链（含定制 clang，才能正确出 Mach-O）
          cd /tmp
          curl -fsSL -o tc.tar.xz https://github.com/theos/toolchain/releases/latest/download/linux-x86_64.tar.xz || \
          curl -fsSL -o tc.tar.xz https://github.com/sbingner/llvm-project/releases/latest/download/linux-iphoneos-toolchain.tar.xz
          mkdir -p $THEOS/toolchain/linux/iphone
          tar -xf tc.tar.xz -C $THEOS/toolchain/linux/iphone --strip-components=1 2>/dev/null || tar -xf tc.tar.xz -C $THEOS/toolchain/linux/
          ls -R $THEOS/toolchain/linux/iphone/bin | head -20 || true
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/**/stehook.dylib
