name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl perl libncurses-dev libssl-dev unzip zlib1g-dev libstdc++-12-dev fakeroot dpkg
      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
      - name: Setup Linux toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          for t in clang clang++ ld lld ld64.lld; do
            real=$(command -v $t 2>/dev/null || command -v ${t/lld/ld.lld} 2>/dev/null || true)
          done
          ln -sf $(command -v clang) $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf $(command -v clang++) $THEOS/toolchain/linux/iphone/bin/clang++
          ln -sf $(command -v ld.lld) $THEOS/toolchain/linux/iphone/bin/ld 2>/dev/null || true
          ln -sf $(command -v lld) $THEOS/toolchain/linux/iphone/bin/ld64 2>/dev/null || true
          # Theos 需要 ld64/ldid，用系统 lld；补工具软链
          ln -sf $(command -v ld.lld) $THEOS/toolchain/linux/iphone/bin/ld.lld 2>/dev/null || true
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/**/stehook.dylib
