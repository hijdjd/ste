name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl perl libncurses-dev libssl-dev unzip zlib1g-dev libstdc++-12-dev fakeroot dpkg
      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
      - name: Setup Linux toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          sudo apt-get install -y xz-utils
          cd /tmp
          curl -fsSL -o tc.tar.lzma https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p tc && tar --lzma -xf tc.tar.lzma -C tc
          ls tc
          SRC=$(find tc -maxdepth 1 -type d -name "*clang*" | head -1)
          echo "SRC=$SRC"
          rm -rf $THEOS/toolchain
          mkdir -p $THEOS/toolchain/linux
          mv "$SRC" $THEOS/toolchain/linux/iphone
          ls $THEOS/toolchain/linux/iphone/bin | head
          $THEOS/toolchain/linux/iphone/bin/clang --version | head -2 || true
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/**/stehook.dylib
