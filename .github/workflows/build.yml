name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make git curl perl libncurses-dev libssl-dev unzip zlib1g-dev libstdc++-12-dev fakeroot dpkg
      - name: Setup Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -L https://github.com/theos/sdks/archive/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || cp -r /tmp/sdks/sdks-master/* $THEOS/sdks/
      - name: Setup Linux toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          TC=$THEOS/toolchain/linux/iphone/bin
          mkdir -p $TC
          ln -sf $(command -v clang) $TC/clang
          ln -sf $(command -v clang++) $TC/clang++
          # Mach-O 链接器用 ld64.lld
          ln -sf $(command -v ld64.lld) $TC/ld64.lld 2>/dev/null || ln -sf /usr/bin/ld64.lld $TC/ld64.lld
          ln -sf $TC/ld64.lld $TC/ld64
          # Theos 通过 ld64 调 ld64.lld；需要 -fuse-ld 指向
          echo "clang: $(clang --version | head -1)"
          echo "ld64.lld: $(command -v ld64.lld || echo MISSING)"
          # 建 ld wrapper：Theos 默认调 $TC/ld
          cat > $TC/ld <<WRAP
          #!/bin/bash
          exec $(command -v ld64.lld || echo /usr/bin/ld64.lld) "$@"
          WRAP
          chmod +x $TC/ld
      - name: Build
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: tweak-deb
          path: packages/*.deb
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: tweak-dylib
          path: .theos/obj/**/stehook.dylib
